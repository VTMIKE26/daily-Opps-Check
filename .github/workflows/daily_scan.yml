name: Peregrine Daily Federal Scanner

on:
  # Single trigger: called by cron-job.org via workflow_dispatch, which
  # hits POST /repos/VTMIKE26/daily-Opps-Check/actions/workflows/daily_scan.yml/dispatches
  # at EXACTLY 7:00 AM EST/EDT every weekday — no GitHub queue delays.
  #
  # NOTE: a "backup" native GitHub cron used to run ~20 min later as a
  # fallback in case cron-job.org missed a day. It's been removed —
  # GitHub's schedule trigger has no way to check "did today's dispatch
  # already run" before firing, so the backup fired unconditionally every
  # day regardless, producing two separate emails instead of one. If
  # cron-job.org ever fails to fire, that day's run is simply skipped;
  # there's currently no automatic fallback.
  workflow_dispatch:

concurrency:
  group: peregrine-daily-scanner
  cancel-in-progress: false

permissions:
  contents: write   # needed so the "Persist previous-run snapshot" step can push previous_run_ids.json back

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install requests

      - name: Run scanner
        env:
          SAM_API_KEY:      ${{ secrets.SAM_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:         mike.kelly@peregrine.io
          EMAIL_FROM:       mikefkelly26@gmail.com
        run: python daily_scan.py

      - name: Persist previous-run snapshot
        # Commits previous_run_ids.json (the "was this in yesterday's run?"
        # snapshot behind the New Today section) back to the repo so
        # tomorrow's run has something to diff against. This file is
        # OVERWRITTEN each run, not accumulated — it only ever reflects the
        # single most recent run. if: always() so a partial/failed scan
        # still saves whatever the script managed to write before it died;
        # the git diff check below is a no-op if nothing changed.
        if: always()
        run: |
          if [ -f previous_run_ids.json ]; then
            git config user.name "peregrine-scanner-bot"
            git config user.email "actions@github.com"
            git add previous_run_ids.json
            if ! git diff --cached --quiet; then
              git commit -m "Update previous_run_ids.json [skip ci]"
              git push
            else
              echo "No change to previous_run_ids.json — skipping commit"
            fi
          else
            echo "previous_run_ids.json not found — scanner likely failed before writing it"
          fi

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digest_*.html
          retention-days: 30

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python - <<'PYEOF'
          import requests, os
          requests.post(
            "https://api.sendgrid.com/v3/mail/send",
            headers={"Authorization": f"Bearer {os.environ['SENDGRID_API_KEY']}",
                     "Content-Type": "application/json"},
            json={
              "personalizations": [{"to": [{"email": "mike.kelly@peregrine.io"}],
                                    "subject": "⚠️ Peregrine Scanner Failed Today"}],
              "from": {"email": "mikefkelly26@gmail.com", "name": "Peregrine Scanner"},
              "content": [{"type": "text/plain",
                           "value": "The scanner failed. Check: https://github.com/VTMIKE26/daily-Opps-Check/actions"}],
            }
          )
          PYEOF
