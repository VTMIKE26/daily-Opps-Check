name: Peregrine Daily Federal Scanner

on:
  # workflow_dispatch was originally meant to be the primary trigger (fired
  # by an external cron-job.org call), with the schedule below as a backup.
  # In practice, the run history shows every actual run came from
  # `schedule`, never from a `workflow_dispatch` event — the external
  # trigger does not appear to have ever successfully fired. So schedule is
  # the real, only-working trigger; workflow_dispatch is kept only so a run
  # can be started manually from the GitHub UI for testing/backfilling.
  #
  # Both the EST and EDT cron lines below fire unconditionally, every
  # weekday, year-round — GitHub Actions cron has no concept of "whichever
  # one is currently correct for daylight saving." Duplicate sends are
  # prevented in daily_scan.py via a committed "already ran today" marker
  # (last_run_date.txt), not by trying to predict which exact UTC hour is
  # correct — that approach is fragile against GitHub's own documented
  # scheduling delays, where a delayed firing can drift past an hour
  # boundary and get wrongly treated as "the wrong one."
  #
  # NOTE: GitHub's `schedule` trigger is not guaranteed to fire at the exact
  # time specified, and can occasionally be delayed or silently skipped
  # during periods of high platform load — this is documented GitHub
  # behavior, not something fixable from the workflow file itself. If a
  # morning email doesn't arrive, check the Actions tab for whether a run
  # appears at all before assuming something in this repo is broken.
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * 1-5'   # 7:20 AM EST (UTC 12:20) — active Nov-Mar
    - cron: '20 11 * * 1-5'   # 7:20 AM EDT (UTC 11:20) — active Mar-Nov

concurrency:
  group: peregrine-daily-scanner
  cancel-in-progress: false

permissions:
  contents: write   # needed so the "Persist previous-run snapshot" step can push previous_run_ids.json back

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install requests

      - name: Run scanner
        env:
          SAM_API_KEY:      ${{ secrets.SAM_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:         mike.kelly@peregrine.io
          EMAIL_FROM:       mikefkelly26@gmail.com
        run: python daily_scan.py

      - name: Persist previous-run snapshot and last-run marker
        # Commits previous_run_ids.json (the "was this in yesterday's run?"
        # snapshot behind the New Today section) and last_run_date.txt (the
        # "did today already send?" duplicate-prevention marker) back to the
        # repo. Both are OVERWRITTEN each run, not accumulated. if: always()
        # so a partial/failed scan still saves whatever the script managed
        # to write before it died; the git diff check below is a no-op if
        # nothing changed. Note last_run_date.txt is only written by the
        # script AFTER a successful send, so a crashed run won't falsely
        # block a same-day retry.
        if: always()
        run: |
          git config user.name "peregrine-scanner-bot"
          git config user.email "actions@github.com"
          [ -f previous_run_ids.json ] && git add previous_run_ids.json
          [ -f last_run_date.txt ] && git add last_run_date.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update scanner state [skip ci]"
            git push
          else
            echo "No state changes to commit"
          fi

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digest_*.html
          retention-days: 30

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python - <<'PYEOF'
          import requests, os
          requests.post(
            "https://api.sendgrid.com/v3/mail/send",
            headers={"Authorization": f"Bearer {os.environ['SENDGRID_API_KEY']}",
                     "Content-Type": "application/json"},
            json={
              "personalizations": [{"to": [{"email": "mike.kelly@peregrine.io"}],
                                    "subject": "⚠️ Peregrine Scanner Failed Today"}],
              "from": {"email": "mikefkelly26@gmail.com", "name": "Peregrine Scanner"},
              "content": [{"type": "text/plain",
                           "value": "The scanner failed. Check: https://github.com/VTMIKE26/daily-Opps-Check/actions"}],
            }
          )
          PYEOF
